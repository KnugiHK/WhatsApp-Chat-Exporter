name: Compile standalone binary

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            filename: wtsexporter_linux_x64
            artifact: binary-linux-x64
          - os: ubuntu-26.04-arm
            filename: wtsexporter_linux_arm64
            artifact: binary-linux-arm64
          - os: windows-latest
            filename: wtsexporter_win_x64.exe
            artifact: binary-windows-x64
          - os: windows-11-arm
            filename: wtsexporter_win_arm64.exe
            artifact: binary-windows-arm64
          - os: macos-latest
            filename: wtsexporter_macos_arm64
            artifact: binary-macos-arm64
          - os: macos-15-intel
            filename: wtsexporter_macos_x64
            artifact: binary-macos-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome javaobj-py3 ordered-set zstandard nuitka==4.3.5
          pip install .
      - name: Build binary with Nuitka
        run: |
          python -m nuitka --onefile --include-data-file=./Whatsapp_Chat_Exporter/whatsapp.html=./Whatsapp_Chat_Exporter/whatsapp.html --assume-yes-for-downloads Whatsapp_Chat_Exporter --output-filename=${{ matrix.filename }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./${{ matrix.filename }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ./${{ matrix.filename }}
